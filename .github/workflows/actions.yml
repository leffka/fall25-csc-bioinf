name: Week 5 notebook

on:
  push:
    paths:
      - "week5/**"
      - ".github/workflows/week5.yml"
  pull_request:
    paths:
      - "week5/**"
      - ".github/workflows/week5.yml"

jobs:
  week5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Miniforge (conda/mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          activate-environment: week5-bio
          python-version: 3.11

      - name: Install bioinformatics tools
        shell: bash -l {0}
        run: |
          mamba install -y -c conda-forge -c bioconda \
            jupyterlab nbconvert \
            minimap2 samtools bcftools htslib seqkit whatshap

      - name: Run week5 notebook
        shell: bash -l {0}
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute week5/week5.ipynb \
            --output week5_executed.ipynb \
            --ExecutePreprocessor.timeout=0

      - name: List outputs (debug)
        shell: bash -l {0}
        run: |
          ls -R
          ls -lh week5
