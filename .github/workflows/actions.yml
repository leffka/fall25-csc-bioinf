name: Week 4 Codon CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 Running on ${{ runner.os }} hosted by GitHub."
      - run: echo "🔎 Branch ${{ github.ref }} | Repo ${{ github.repository }}"

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Codon
        shell: bash
        run: |
          mkdir -p "${HOME}/.codon"
          curl -fsSL https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz \
            | tar zxvf - --strip-components=1 -C "${HOME}/.codon"
          # Optional: seq plugin
          curl -fsSL https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz \
            | tar zxvf - -C "${HOME}/.codon/lib/codon/plugins"
          echo "${HOME}/.codon/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps & configure Codon interop
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow find_libpython
          # CODON_PYTHON -> path to libpython
          echo "CODON_PYTHON=$(python -c 'import find_libpython as f; print(f.find_libpython())')" >> "$GITHUB_ENV"
          # PYTHONPATH -> directory that contains the PIL package (evaluate.sh will prepend week4/)
          echo "PYTHONPATH=$(python -c 'import PIL, os; print(os.path.dirname(PIL.__file__))')" >> "$GITHUB_ENV"

      - name: Verify environment
        shell: bash
        run: |
          codon --version
          python -c "import PIL, PIL.Image, PIL.ImageDraw, PIL.ImageFont; print('Pillow OK:', PIL.__version__)"
          echo "CODON_PYTHON=$CODON_PYTHON"
          echo "PYTHONPATH=$PYTHONPATH"

      - name: Make evaluate.sh executable
        run: chmod +x week4/evaluate.sh

      - name: Run Week 4 tests
        working-directory: week4
        run: ./evaluate.sh
