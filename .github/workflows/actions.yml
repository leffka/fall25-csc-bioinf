name: Week 6 Notebook

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/week6.yml"
  pull_request:
    paths:
      - "week6/**"
      - ".github/workflows/week6.yml"

jobs:
  week6:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0} # specific shell for conda

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Miniforge (conda/mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          activate-environment: week6-bio
          python-version: 3.11

      - name: Install bioinformatics tools
        run: |
          # Install Core Bio tools and Scanpy ecosystem
          mamba install -y -c conda-forge -c bioconda \
            jupyterlab nbconvert \
            salmon alevin-fry \
            scanpy python-igraph leidenalg \
            pandas matplotlib
          
          # CellTypist is best installed via pip to avoid dependency conflicts
          pip install celltypist

      - name: Run week6 notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute week6/week6.ipynb \
            --output week6_executed.ipynb \
            --ExecutePreprocessor.timeout=600 
            # Timeout increased to 600s (10 mins) as SC analysis can be slow

      - name: List outputs (debug)
        run: |
          ls -R week6
