# Toggle tiny test (fast) vs real data
use_test_data: false

# Test transcripts + reads (official kallisto tiny test)
test_transcripts_url: "https://raw.githubusercontent.com/pachterlab/kallisto/master/test/transcripts.fasta.gz"
test_reads_1_url: "https://raw.githubusercontent.com/pachterlab/kallisto/master/test/reads_1.fastq.gz"
test_reads_2_url: "https://raw.githubusercontent.com/pachterlab/kallisto/master/test/reads_2.fastq.gz"

# Real transcriptome - GENCODE v25 (2016 release, matching paper publication year)
transcript_fasta_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_25/gencode.v25.transcripts.fa.gz"

# Real samples - GEUVADIS NA12716 (sample used in kallisto paper for simulations)
# Using HTTP instead of FTP for more reliable downloads
samples:
  NA12716:
    r1: "http://ftp.sra.ebi.ac.uk/vol1/fastq/ERR188/ERR188021/ERR188021_1.fastq.gz"
    r2: "http://ftp.sra.ebi.ac.uk/vol1/fastq/ERR188/ERR188021/ERR188021_2.fastq.gz"

# Kallisto params
kallisto:
  k: 31
  threads: 4
  bootstraps: 100  # Increased to 100 for better uncertainty estimates (paper used 100)

# Salmon params
salmon:
  threads: 4

# Simulation (Polyester) - will simulate from real transcriptome now
simulation:
  n_transcripts: 10000  # Increased for more realistic simulation
  n_reads_per_sample: 30000000  # 30 million reads to match paper's benchmark
  paired: true
  read_len: 75  # GEUVADIS read length
  frag_mean: 200
  frag_sd: 30
  seed: 42
